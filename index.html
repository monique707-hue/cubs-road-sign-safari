<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#2f5d50" />
  <title>Cubs Road Sign Safari</title>
  <style>
    :root{
      --bg:#f6f2e8; --card:#fff; --green:#2f5d50; --green-dark:#24483f;
      --yellow:#f4c95d; --text:#24302c; --muted:#6f7a75; --border:#ded8ca;
      --danger:#b73d36; --danger-bg:#faecea;
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text)}
    .page{width:min(920px,calc(100% - 28px));margin:0 auto;padding:28px 0 50px}
    .hero{text-align:center;padding:28px 18px 20px}
    .lights{display:inline-flex;gap:8px;background:#26312e;border-radius:999px;padding:8px 12px;margin-bottom:14px}
    .light{width:17px;height:17px;border-radius:50%}.red{background:#ef6257}.amber{background:#f4c95d}.green{background:#55b982}
    h1{margin:0;color:var(--green);font-size:clamp(30px,7vw,52px);line-height:1}
    .subtitle{max-width:600px;margin:12px auto 0;font-size:17px;color:var(--muted);line-height:1.5}
    .panel{background:var(--card);border:1px solid var(--border);border-radius:22px;padding:22px;box-shadow:0 8px 28px rgba(30,50,40,.07);margin-top:20px}
    .panel h2{margin:0 0 18px;color:var(--green);font-size:24px}
    label{display:block;font-weight:700;margin:16px 0 7px}
    input[type="text"],textarea,input[type="file"]{width:100%;border:1px solid var(--border);border-radius:14px;background:#fff;padding:13px 14px;font:inherit;color:var(--text)}
    textarea{min-height:96px;resize:vertical}
    .upload-box{border:2px dashed #bfc8c3;border-radius:16px;padding:16px;background:#fbfaf6}
    .preview{display:none;margin-top:14px;width:100%;max-height:320px;object-fit:contain;border-radius:14px;background:#eef0ec}
    .submit-button{width:100%;margin-top:20px;border:0;border-radius:14px;padding:14px 18px;background:var(--green);color:#fff;font-size:17px;font-weight:700;cursor:pointer}
    .submit-button:hover{background:var(--green-dark)} .submit-button:disabled{opacity:.55;cursor:not-allowed}
    .status{display:none;margin-top:14px;padding:11px 13px;border-radius:12px;font-size:14px}
    .status.success{display:block;background:#e9f5ed;color:#255c38}.status.error{display:block;background:#f9e7e5;color:var(--danger)}
    .gallery-head{display:flex;justify-content:space-between;align-items:end;gap:12px;margin:32px 0 14px}
    .gallery-head h2{margin:0;color:var(--green);font-size:28px}.count{color:var(--muted);font-size:14px}
    .gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
    .sign-card{background:#fff;border:1px solid var(--border);border-radius:18px;overflow:hidden;box-shadow:0 6px 18px rgba(30,50,40,.06)}
    .sign-card img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block;background:#eceee9}
    .sign-card-content{padding:15px}.meaning{font-weight:700;font-size:17px;line-height:1.35;margin:0 0 10px}.spotted{margin:0;color:var(--muted);font-size:14px}
    .delete-button{width:100%;margin-top:14px;border:1px solid #e4b2ae;border-radius:11px;padding:9px 12px;background:var(--danger-bg);color:var(--danger);font-size:14px;font-weight:700;cursor:pointer}
    .delete-button:hover{background:#f5d9d6}.delete-button:disabled{opacity:.55;cursor:not-allowed}
    .empty{grid-column:1/-1;border:2px dashed #cfc8b9;border-radius:18px;text-align:center;padding:34px 20px;color:var(--muted);background:rgba(255,255,255,.45)}
    .note{margin-top:14px;color:var(--muted);font-size:12px;text-align:center;line-height:1.5}
    @media(max-width:760px){.gallery{grid-template-columns:repeat(2,1fr)}}
    @media(max-width:500px){.page{width:min(100% - 18px,920px);padding-top:12px}.hero{padding:20px 10px 12px}.panel{padding:17px}.gallery{grid-template-columns:1fr}.gallery-head{align-items:center}}
  </style>
</head>
<body>
<main class="page">
  <section class="hero">
    <div class="lights" aria-hidden="true"><span class="light red"></span><span class="light amber"></span><span class="light green"></span></div>
    <h1>Cubs Road Sign Safari</h1>
    <p class="subtitle">Spot a road sign, take a photo and add it to our Road Sign Safari!</p>
  </section>

  <section class="panel">
    <h2>Add a road sign</h2>
    <form id="signForm">
      <label for="photo">Photo of the sign</label>
      <div class="upload-box">
        <input id="photo" name="photo" type="file" accept="image/jpeg,image/png,image/webp,image/heic,image/heif" capture="environment" required />
        <img id="preview" class="preview" alt="Photo preview" />
      </div>

      <label for="meaning">What do you think it means?</label>
      <textarea id="meaning" name="meaning" maxlength="180" placeholder="e.g. Cars must stop here." required></textarea>

      <label for="spottedBy">Who spotted it?</label>
      <input id="spottedBy" name="spottedBy" type="text" maxlength="50" placeholder="e.g. James" required />

      <button id="submitBtn" class="submit-button" type="submit">Add My Road Sign 🚦</button>
      <div id="status" class="status" role="status"></div>
    </form>

    <div class="note">Please use only a first name or Cub nickname. Avoid photos that clearly show children's faces, house numbers or vehicle number plates.</div>
  </section>

  <div class="gallery-head">
    <h2>Our Road Signs</h2>
    <div class="count" id="count">Loading…</div>
  </div>
  <section id="gallery" class="gallery"><div class="empty">Loading our road signs… 🚦</div></section>
</main>

<script>
const form = document.getElementById('signForm');
const photoInput = document.getElementById('photo');
const preview = document.getElementById('preview');
const gallery = document.getElementById('gallery');
const count = document.getElementById('count');
const statusBox = document.getElementById('status');
const submitBtn = document.getElementById('submitBtn');

function escapeHtml(text){
  return String(text ?? '')
    .replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;')
    .replaceAll('"','&quot;').replaceAll("'","&#039;");
}

function setStatus(message, type){
  statusBox.textContent = message;
  statusBox.className = `status ${type}`;
}

async function loadSigns(){
  try{
    const response = await fetch('/api/signs', { headers: { 'Accept':'application/json' } });
    if(!response.ok) throw new Error('Could not load signs');
    const signs = await response.json();
    render(signs);
  }catch(error){
    count.textContent = 'Unable to load';
    gallery.innerHTML = '<div class="empty">We could not load the shared gallery. Please try again shortly.</div>';
  }
}

function render(signs){
  count.textContent = `${signs.length} ${signs.length === 1 ? 'sign' : 'signs'} spotted`;
  if(!signs.length){
    gallery.innerHTML = '<div class="empty">No road signs yet — be the first to spot one! 🛑</div>';
    return;
  }

  gallery.innerHTML = signs.map(sign => `
    <article class="sign-card">
      <img src="${escapeHtml(sign.image_url)}" alt="Road sign uploaded by ${escapeHtml(sign.spotted_by)}" loading="lazy">
      <div class="sign-card-content">
        <p class="meaning">${escapeHtml(sign.meaning)}</p>
        <p class="spotted">Spotted by: <strong>${escapeHtml(sign.spotted_by)}</strong></p>
        <button class="delete-button" type="button" data-id="${escapeHtml(sign.id)}">🗑 Delete</button>
      </div>
    </article>
  `).join('');
}

gallery.addEventListener('click', async event => {
  const button = event.target.closest('.delete-button');
  if(!button) return;

  const confirmed = confirm('Delete this road sign? This will also delete the uploaded photo.');
  if(!confirmed) return;

  button.disabled = true;
  button.textContent = 'Deleting…';

  try{
    const response = await fetch(`/api/signs?id=${encodeURIComponent(button.dataset.id)}`, {
      method: 'DELETE',
      headers: { 'Accept':'application/json' }
    });

    const result = await response.json().catch(() => ({}));
    if(!response.ok) throw new Error(result.error || 'Delete failed');

    await loadSigns();
  }catch(error){
    alert(error.message || 'Could not delete this road sign.');
    button.disabled = false;
    button.textContent = '🗑 Delete';
  }
});

photoInput.addEventListener('change', () => {
  const file = photoInput.files[0];
  if(!file){ preview.style.display='none'; return; }
  const url = URL.createObjectURL(file);
  preview.onload = () => URL.revokeObjectURL(url);
  preview.src = url;
  preview.style.display = 'block';
});

form.addEventListener('submit', async event => {
  event.preventDefault();
  statusBox.className = 'status';

  const file = photoInput.files[0];
  if(!file) return setStatus('Please choose a photo.', 'error');
  if(file.size > 5 * 1024 * 1024) return setStatus('Please choose a photo smaller than 5 MB.', 'error');

  submitBtn.disabled = true;
  submitBtn.textContent = 'Uploading…';

  try{
    const data = new FormData(form);
    const response = await fetch('/api/signs', { method:'POST', body:data });
    const result = await response.json().catch(() => ({}));
    if(!response.ok) throw new Error(result.error || 'Upload failed');

    form.reset();
    preview.src = '';
    preview.style.display = 'none';
    setStatus('Road sign added! 🚦', 'success');
    await loadSigns();
    document.querySelector('.gallery-head').scrollIntoView({behavior:'smooth', block:'start'});
  }catch(error){
    setStatus(error.message || 'Something went wrong. Please try again.', 'error');
  }finally{
    submitBtn.disabled = false;
    submitBtn.textContent = 'Add My Road Sign 🚦';
  }
});

loadSigns();
</script>
</body>
</html>
